<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuthfieBudie_Gallery</title>
    <link rel="icon" type="image/x-icon" href="../assets/logo/logo.ico">
    <link rel="stylesheet" href="/css/shorts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="shorts-app">

        <div class="shorts-topbar">
            <a href="index.html" class="shorts-home-link">
                <img class="shorts-logo" src="/assets/logo/logo.png" alt="">
                <span>Gallery</span>
            </a>

            <nav class="shorts-nav-links">
                <a href="index.html">Home</a>
                <a href="videos.html">Videos</a>
                <a href="photo.html">Photos</a>
                <a href="channels.html">Channels</a>
            </nav>

                <span id="shortsCounter" class="shorts_counter">0 / 0</span>

        <div class="shorts-feed" id="shortsFeed">
            <p class="shorts-loading">Loading...</p>

        <div class="shorts-nav">
            <button class="shorts-nav-btn" id="shortsPrevBtn" type="button" aria-label="Short sebelumnya"><i class="fa-solid fa-chevron-up"></i></button>
            <button class="shorts-nav-btn" id="shortsNextBtn" type="button" aria-label="Short berikutnya"><i class="fa-solid fa-chevron-down"></i></button>
